name: P02 - Publicacao manual do terminal

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Apos aprovar e mesclar P02, digite PUBLICAR_P02 para autorizar este deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p02-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && inputs.approval == 'PUBLICAR_P02'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar somente artefato validado
        id: deployment
        uses: actions/deploy-pages@v4
